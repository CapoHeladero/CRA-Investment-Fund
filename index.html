/* ---------------- MarketCanvas — living candlestick tape (rAF, no assets) ---------------- */
function MarketCanvas({ mode = "hero", className, style }) {
  const ref = useRef(null);
  useEffect(() => {
    const cv = ref.current;
    const ctx = cv.getContext("2d");
    let W, H, raf, candles = [], particles = [], price, tPrev = 0, acc = 0;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const DENSE = mode === "hero";
    const CANDLE_W = DENSE ? 26 : 34;
    const SPEED = DENSE ? 42 : 22;           // px/sec leftward drift
    const ALPHA = DENSE ? 1 : 0.6;

    const newCandle = () => {
      const o = price;
      const drift = (Math.random() - 0.46) * H * 0.045;
      price = Math.max(H * 0.22, Math.min(H * 0.85, price + drift));
      return {
        o, c: price,
        hi: Math.max(o, price) + Math.random() * H * 0.025,
        lo: Math.min(o, price) - Math.random() * H * 0.025,
        x: W + CANDLE_W,
        born: performance.now(),
      };
    };

    const resize = () => {
      W = cv.width = cv.offsetWidth * dpr;
      H = cv.height = cv.offsetHeight * dpr;
      price = H * 0.55;
      candles = [];
      const n = Math.ceil(W / (CANDLE_W * dpr)) + 3;
      for (let i = 0; i < n; i++) {
        const c = newCandle();
        c.x = i * CANDLE_W * dpr;
        c.born = 0;
        candles.push(c);
      }
    };

    const draw = (t) => {
      const dt = Math.min((t - tPrev) / 1000, 0.05); tPrev = t;
      ctx.clearRect(0, 0, W, H);

      // grid
      ctx.strokeStyle = `rgba(52,211,153,${0.05 * ALPHA})`;
      ctx.lineWidth = 1;
      const gy = H / 8;
      for (let i = 1; i < 8; i++) { ctx.beginPath(); ctx.moveTo(0, i * gy); ctx.lineTo(W, i * gy); ctx.stroke(); }

      // drift + recycle
      const dx = SPEED * dpr * dt;
      candles.forEach((k) => (k.x -= dx));
      if (candles.length && candles[0].x < -CANDLE_W * dpr) candles.shift();
      if (candles.length && candles[candles.length - 1].x < W - CANDLE_W * dpr) candles.push(newCandle());

      // candles
      const bw = CANDLE_W * dpr * 0.5;
      candles.forEach((k) => {
        const up = k.c <= k.o;
        const age = Math.min((t - k.born) / 400, 1);
        const a = age * ALPHA;
        const col = up ? "52,211,153" : "248,113,113";
        ctx.strokeStyle = `rgba(${col},${0.32 * a})`;
        ctx.lineWidth = 1.2 * dpr;
        ctx.beginPath(); ctx.moveTo(k.x + bw / 2, k.hi); ctx.lineTo(k.x + bw / 2, k.lo); ctx.stroke();
        ctx.fillStyle = `rgba(${col},${0.2 * a})`;
        ctx.fillRect(k.x, Math.min(k.o, k.c), bw, Math.max(2, Math.abs(k.c - k.o)));
      });

      // glowing price line through closes
      ctx.save();
      ctx.strokeStyle = `rgba(110,231,183,${0.75 * ALPHA})`;
      ctx.lineWidth = 1.6 * dpr;
      ctx.shadowColor = "rgba(52,211,153,0.9)";
      ctx.shadowBlur = 14 * dpr;
      ctx.beginPath();
      candles.forEach((k, i) => { const x = k.x + bw / 2; i ? ctx.lineTo(x, k.c) : ctx.moveTo(x, k.c); });
      ctx.stroke();
      ctx.restore();

      // area fill under the line (dim mode gets more)
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, `rgba(52,211,153,${(DENSE ? 0.05 : 0.1)})`);
      grad.addColorStop(1, "rgba(52,211,153,0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      candles.forEach((k, i) => { const x = k.x + bw / 2; i ? ctx.lineTo(x, k.c) : ctx.moveTo(x, k.c); });
      ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

      // rising spark particles
      acc += dt;
      if (acc > 0.12 && particles.length < 70) { acc = 0; particles.push({ x: Math.random() * W, y: H + 10, v: (18 + Math.random() * 30) * dpr, a: 0.5 + Math.random() * 0.5, r: (0.8 + Math.random() * 1.6) * dpr }); }
      particles.forEach((pt) => { pt.y -= pt.v * dt; pt.a -= dt * 0.12; });
      particles = particles.filter((pt) => pt.a > 0 && pt.y > -10);
      particles.forEach((pt) => {
        ctx.fillStyle = `rgba(110,231,183,${pt.a * 0.35 * ALPHA})`;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, 6.283); ctx.fill();
      });

      raf = requestAnimationFrame(draw);
    };

    resize();
    raf = requestAnimationFrame(draw);
    window.addEventListener("resize", resize);
    return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", resize); };
  }, [mode]);
  return <canvas ref={ref} className={className} style={style} />;
}

/* ---------------- BlurText (word-by-word blur-in) ---------------- */
function BlurText({ text, className }) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) { setInView(true); obs.disconnect(); } },
      { threshold: 0.1 }
    );
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  const words = text.split(" ");
  return (
    <p ref={ref} className={className} style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", rowGap: "0.1em" }}>
      {words.map((w, i) => (
        <motion.span
          key={i}
          style={{ display: "inline-block", marginRight: "0.28em" }}
          initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
          animate={inView ? {
            filter: ["blur(10px)", "blur(5px)", "blur(0px)"],
            opacity: [0, 0.5, 1],
            y: [50, -5, 0],
          } : {}}
          transition={{ duration: 0.7, times: [0, 0.5, 1], ease: "easeOut", delay: (i * 100) / 1000 }}
        >{w}</motion.span>
      ))}
    </p>
  );
}

/* ---------------- CountUp ---------------- */
function CountUp({ end, decimals = 0, prefix = "", suffix = "", duration = 1400 }) {
  const ref = useRef(null);
  const [val, setVal] = useState(0);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => {
      if (!e.isIntersecting) return;
      obs.disconnect();
      const start = performance.now();
      const step = (now) => {
        const p = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        setVal(end * eased);
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }, { threshold: 0.3 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, [end]);
  return <span ref={ref}>{prefix}{val.toFixed(decimals)}{suffix}</span>;
}

/* ---------------- Intro (cinematic entry, once per session) ---------------- */
function Intro({ onDone }) {
  const [p, setP] = useState(0);
  const [leaving, setLeaving] = useState(false);
  const leave = () => { if (!leaving) { setLeaving(true); setTimeout(onDone, 950); } };
  useEffect(() => {
    const start = performance.now(); const DUR = 2100; let raf;
    const step = (t) => {
      const k = Math.min((t - start) / DUR, 1);
      setP(Math.round(k * 100));
      if (k < 1) raf = requestAnimationFrame(step); else leave();
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, []);
  return (
    <motion.div
      className="fixed inset-0 z-[100] bg-black flex flex-col items-center justify-center cursor-pointer"
      animate={leaving ? { y: "-100%" } : { y: 0 }}
      transition={{ duration: 0.95, ease: [0.76, 0, 0.24, 1] }}

  useEffect(() => {
    const f = () => { const d = document.documentElement; setW((d.scrollTop / (d.scrollHeight - d.clientHeight)) * 100 || 0); };

    return () => window.removeEventListener("scroll", f);

  return <div className="fixed top-0 left-0 h-[2px] bg-emerald-400 z-[90] rounded-full" style={{ width: w + "%", boxShadow: "0 0 12px rgba(52,211,153,.8)" }} />;
}

/* ---------------- Ticker marquee ---------------- */
function Ticker() {
  // deterministic pseudo-changes so the tape looks alive but stable per load
  const chg = (t) => {
    let h = 0; for (const ch of t) h = (h * 31 + ch.charCodeAt(0)) % 997;
    return ((h % 90) / 10 - 3.2).toFixed(1); // range ~ -3.2 .. +5.7
  };
  const items = [...ALL_TICKERS, ...ALL_TICKERS];
  return (
    <div className="relative bg-black py-5 overflow-hidden border-y border-emerald-400/20">
      <div className="marquee-track">
        {items.map((t, i) => {
          const c = chg(t);
          const up = parseFloat(c) >= 0;
          return (
            <span key={i} className="mx-6 flex items-center gap-2 font-body text-sm tracking-widest">
              <span className={"w-1 h-1 rounded-full inline-block " + (up ? "bg-emerald-400" : "bg-red-400")} />
              <span className="text-white/80">{t}</span>
              <span className={up ? "text-emerald-400" : "text-red-400"}>{up ? "+" : ""}{c}%</span>
            </span>
          );
        })}
      </div>
    </div>
  );
}

/* ---------------- App ---------------- */
function App() {
  const [intro, setIntro] = useState(() => { try { return !sessionStorage.getItem("cra.intro"); } catch (e) { return true; } });
  const done = () => { try { sessionStorage.setItem("cra.intro", "1"); } catch (e) {} setIntro(false); };
  return (
    <div className="bg-black">
      {intro && <Intro onDone={done} />}
      <ScrollProgress />
      <Hero />
      <Ticker />
      <Ideas />
      <Macro />
      <SizerWidget />
      <Principles />
      <Capabilities />
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
