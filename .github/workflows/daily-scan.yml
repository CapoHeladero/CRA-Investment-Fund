name: Daily market scan

on:
  schedule:
    - cron: '30 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cra-publish
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scanner
        run: npm install

      - name: Run scanner
        working-directory: scanner
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node scanner.js

      - name: Commit results
        run: |
          git config user.name "CRA Scanner Bot"
          git config user.email "scanner@cra-fund.bot"
          git add results/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Daily scan: $(date -u +%Y-%m-%d)"
          # Retry so a competing commit (e.g. the daily feeds push) can't fail the run
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying in 10s..."
            sleep 10
          done
          echo "::error::Could not push scan results after 5 attempts"
          exit 1
