name: Daily market scan

on:
  schedule:
    - cron: '30 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scanner
        run: npm install

      - name: Run scanner
        working-directory: scanner
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node scanner.js

      - name: Commit results
        run: |
          git config user.name "CRA Scanner Bot"
          git config user.email "scanner@cra-fund.bot"
          git add results/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily scan: $(date -u +%Y-%m-%d)"
            git push
          fi
